name: Installateur Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Tests du moteur audio
        run: dotnet run --project tests/VoiceStudio.SelfTest -c Release

      - name: Compilation (exe autonome, .NET inclus)
        run: >
          dotnet publish src/VoiceStudio/VoiceStudio.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Installateur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc installer\VoiceStudio.iss

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-Setup
          path: installer/Output/VoiceStudio-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceStudio-portable
          path: publish/VoiceStudio.exe
